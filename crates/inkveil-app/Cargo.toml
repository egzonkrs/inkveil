[package]
name = "inkveil-app"
description = "The Inkveil desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "inkveil"
path = "src/main.rs"

[dependencies]
inkveil-crypto.workspace = true
inkveil-doc.workspace = true
inkveil-platform.workspace = true
inkveil-spell.workspace = true
inkveil-store.workspace = true

chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
futures = "0.3"
gpui.workspace = true
gpui_platform.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
postcard.workspace = true
serde.workspace = true
smallvec = "1"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation.workspace = true
zeroize.workspace = true
ureq = { version = "3.5", default-features = false, features = ["json", "rustls"] }
serde_json = "1.0.154"

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
